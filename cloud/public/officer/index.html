<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DevPlant Officers</title>
  <meta name="description" content="Reports from DevPlant farmers for extension officers: overview, possible hotspots, statuses and questions.">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#F6F7F2" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0F1611" media="(prefers-color-scheme: dark)">
  <link rel="icon" href="../mixes/logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500&family=Inter:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="../mixes/style.css">
  <link rel="stylesheet" href="officer.css">
</head>
<body>
  <header class="bar">
    <div class="wrap bar-in">
      <a href="./" class="brand" aria-label="DevPlant officers">
        <img src="../mixes/logo.png" alt="" width="40" height="40">
        <span>DevPlant <em class="o-brand-sub">officers</em></span>
      </a>
      <div class="o-who" id="who" hidden>
        <span id="who-name"></span>
        <button class="btn ghost small" id="sign-out" type="button">Sign out</button>
      </div>
    </div>
  </header>

  <main class="wrap o-main">
    <!-- sign in -->
    <section id="signin" class="o-signin" hidden>
      <h1>Sign in</h1>
      <p class="soft">For extension officers. Your name and access code come from the person who runs this site.</p>
      <form id="signin-form" class="o-form">
        <label>Name <input name="name" autocomplete="username" required></label>
        <label>Access code <input name="code" type="password" autocomplete="current-password" required></label>
        <button class="btn" type="submit">Sign in</button>
        <p class="o-error" id="signin-error" role="alert"></p>
      </form>
    </section>

    <!-- signed in -->
    <section id="board" hidden>
      <nav class="o-tabs" role="tablist" aria-label="Views">
        <button role="tab" data-tab="overview" aria-selected="true">Overview</button>
        <button role="tab" data-tab="reports" aria-selected="false">Reports</button>
        <button role="tab" data-tab="questions" aria-selected="false">Questions <span class="o-count" id="open-count" hidden></span></button>
      </nav>

      <form class="o-filters" id="filters">
        <label>Country
          <select name="country">
            <option value="">All</option>
            <option>Zambia</option><option>Malawi</option><option>Zimbabwe</option><option>Botswana</option><option>Other</option>
          </select>
        </label>
        <label>District <input name="district" placeholder="All"></label>
        <label>Period
          <select name="days">
            <option value="7">Last 7 days</option>
            <option value="14">Last 14 days</option>
            <option value="30" selected>Last 30 days</option>
            <option value="90">Last 90 days</option>
          </select>
        </label>
        <label data-only="reports">Status
          <select name="verification">
            <option value="">All</option>
            <option value="REPORTED">Reported</option>
            <option value="UNDER_REVIEW">Under review</option>
            <option value="FIELD_VERIFIED">Field verified</option>
          </select>
        </label>
        <button class="btn ghost small" type="submit">Apply</button>
      </form>

      <div id="tab-overview" role="tabpanel"></div>
      <div id="tab-reports" role="tabpanel" hidden></div>
      <div id="tab-questions" role="tabpanel" hidden></div>
    </section>
  </main>

  <dialog id="detail" class="o-dialog" aria-labelledby="detail-title"></dialog>

  <script type="module" src="officer.js"></script>
</body>
</html>
